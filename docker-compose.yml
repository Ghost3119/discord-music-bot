services:
  sonora:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sonora
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Escucha en todas las interfaces solo dentro del namespace de red del contenedor.
      # En el host solo se publica en loopback (127.0.0.1). Si se expone fuera de loopback,
      # hazlo únicamente detrás de un reverse proxy con HTTPS y WEB_ORIGIN=https://...
      WEB_HOST: 0.0.0.0
      WEB_BIND_PUBLIC: 'true'
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:${WEB_PORT:-8080}'
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:' + (process.env.WEB_PORT || 8080) + '/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    profiles: ['postgres']
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SONORA_POSTGRES_USER:-sonora}
      POSTGRES_PASSWORD: ${SONORA_POSTGRES_PASSWORD:-sonora-local-development-only}
      POSTGRES_DB: ${SONORA_POSTGRES_DB:-sonora}
    volumes:
      - sonora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  sonora_pgdata:
