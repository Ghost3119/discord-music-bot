version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint v8 peer range is >=4.8.4 <6.1.0 (TypeScript 7 tsgo breaks npm ci ERESOLVE)
      - dependency-name: 'typescript'
        versions:
          - '>= 6.1.0'

  - package-ecosystem: 'npm'
    directory: '/frontend'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint v8 peer range is >=4.8.4 <6.1.0 (TypeScript 7 tsgo breaks npm ci ERESOLVE)
      - dependency-name: 'typescript'
        versions:
          - '>= 6.1.0'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
